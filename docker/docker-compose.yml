services:
  db:
    image: postgres:16-alpine
    container_name: edgevision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: edge_user
      POSTGRES_PASSWORD: edge_password
      POSTGRES_DB: edgevision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge_user -d edgevision_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: edgevision-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://edge_user:edge_password@db:5432/edgevision_db
      - MODEL_PATH=yolov8n.pt
      - CAMERA_SOURCE=0
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../frontend:/app/frontend
      - ../models:/app/models
    # To enable GPU acceleration with NVIDIA Container Toolkit, uncomment below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
